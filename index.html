<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>KYS EVENT — QR Check-In</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b1020;color:#fff;font-family:Arial,sans-serif}
.app{width:100%;max-width:520px;min-height:100vh;margin:auto;padding:18px 16px 28px}
.top{text-align:center;margin:8px 0 16px}.top h1{margin:0;font-size:27px}.top p{margin:6px 0 0;color:#aeb7c9;font-size:14px}
.card{background:#151c2e;border:1px solid #29334a;border-radius:20px;padding:14px;box-shadow:0 12px 35px rgba(0,0,0,.25)}
#reader{width:100%;overflow:hidden;border-radius:15px;background:#05070d;min-height:300px}
#reader video{width:100%!important;height:auto!important;border-radius:15px}
.note{text-align:center;color:#9ca8bd;font-size:13px;margin:11px 4px 0}
.status{margin-top:14px;padding:18px 14px;border-radius:16px;text-align:center;background:#101728;border:1px solid #29334a;min-height:120px;display:flex;flex-direction:column;justify-content:center;gap:7px}
.big{font-size:23px;font-weight:800}.small{color:#b7c0d2;font-size:14px;line-height:1.45;word-break:break-word}
.success{border-color:#2d9d67;background:#0e2119}.success .big{color:#52e08e}
.danger{border-color:#a94343;background:#241315}.danger .big{color:#ff7272}
.warning{border-color:#9b7b2d;background:#241f10}.warning .big{color:#ffd35a}
.controls{display:flex;gap:10px;margin-top:12px}button{flex:1;border:0;border-radius:13px;padding:14px 12px;font-size:15px;font-weight:700;cursor:pointer}
#startBtn{background:#fff;color:#111827}#stopBtn{background:#29334a;color:#fff}button:disabled{opacity:.45;cursor:not-allowed}
.volunteer{margin-bottom:12px}.volunteer label{display:block;color:#b7c0d2;font-size:13px;margin:0 0 6px 2px}
.volunteer input{width:100%;border:1px solid #36425c;background:#0d1423;color:#fff;border-radius:12px;padding:13px 12px;font-size:16px;outline:none}
.footer{text-align:center;color:#71809a;font-size:12px;margin-top:18px;line-height:1.45}
.loader{width:24px;height:24px;margin:0 auto 3px;border:3px solid #44516b;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:390px){.app{padding-left:10px;padding-right:10px}.top h1{font-size:24px}}
</style>
</head>
<body>
<div class="app">
<div class="top"><h1>KYS EVENT</h1><p>QR Check-In • 10 October • 7 PM • Mumbai</p></div>
<div class="card">
<div class="volunteer"><label for="volunteer">Volunteer Name</label><input id="volunteer" type="text" placeholder="Enter volunteer name" autocomplete="name"></div>
<div id="reader"></div>
<div class="note">Allow camera access when your browser asks.</div>
<div id="status" class="status"><div class="big">READY TO SCAN</div><div class="small">Point the camera at a ticket QR code.</div></div>
<div class="controls"><button id="startBtn">START SCANNER</button><button id="stopBtn" disabled>STOP</button></div>
</div>
<div class="footer">One QR = one person. A used QR cannot be used again.</div>
</div>

<script>
(function(){
"use strict";
const API_URL="https://script.google.com/macros/s/AKfycbwzmhPRaHzTuSWV9ty-RY8ZAdqOyAkKeqGWvU1FiI-lNVsqRuouRhd7dUd1tTtVOlnr/exec";
const SCANNER_KEY="KOLbmD4g1LoiBKe6ooZK7LR_OmyBICce";
const TIMEOUT=20000;
let scanner=null,running=false,busy=false,timer=null,callbackName=null;

const reader=document.getElementById("reader");
const box=document.getElementById("status");
const volunteer=document.getElementById("volunteer");
const start=document.getElementById("startBtn");
const stop=document.getElementById("stopBtn");

function esc(v){return String(v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function status(cls,big,small){box.className="status "+(cls||"");box.innerHTML='<div class="big">'+esc(big)+'</div><div class="small">'+esc(small||"")+"</div>"}
function verifying(){box.className="status";box.innerHTML='<div class="loader"></div><div class="big">VERIFYING TICKET…</div><div class="small">Checking payment and ticket status.</div>'}
function tokenFrom(text){
  text=String(text||"").trim();if(!text)return "";
  try{const u=new URL(text),t=u.searchParams.get("token");if(t)return t.trim()}catch(e){}
  if(/^.+_T\d+$/.test(text))return text;
  const m=text.match(/[?&]token=([^&#\s]+)/i);if(m){try{return decodeURIComponent(m[1]).trim()}catch(e){return m[1].trim()}}
  return "";
}
function cleanup(){
  if(callbackName){try{delete window[callbackName]}catch(e){window[callbackName]=undefined}}
  callbackName=null;if(timer){clearTimeout(timer);timer=null}
}
function result(r){
  r=r||{};const s=String(r.status||"").toUpperCase();
  if(s==="USED"){
    if(r.ok===true)status("success","ENTRY ALLOWED",(r.name||"Ticket")+(r.bookingId?" • "+r.bookingId:""));
    else status("danger","ALREADY CHECKED IN",(r.name||"This ticket has already been used.")+(r.checkedInBy?" • Checked in by "+r.checkedInBy:""));
    return;
  }
  if(s==="NOT VALID"){status("danger","NOT VALID",r.message||"Payment not verified.");return}
  if(s==="INVALID"){status("danger","INVALID TICKET",r.message||"Ticket could not be found.");return}
  if(s==="UNAUTHORIZED"){status("danger","SCANNER NOT AUTHORIZED","Scanner key is invalid.");return}
  if(s==="BUSY"){status("warning","PLEASE SCAN AGAIN",r.message||"Ticket server is busy.");return}
  status("danger","SERVER ERROR",r.message||"Unexpected response from ticket server.");
}
async function stopScanner(){
  if(!scanner)return;
  try{await scanner.stop()}catch(e){}
  try{await scanner.clear()}catch(e){}
  scanner=null;running=false;start.disabled=false;stop.disabled=true;
}
async function startScanner(){
  if(running||busy)return;
  if(!volunteer.value.trim()){status("warning","VOLUNTEER NAME REQUIRED","Enter your name before scanning.");volunteer.focus();return}
  if(typeof Html5Qrcode==="undefined"){status("danger","SCANNER LIBRARY ERROR","QR scanner library did not load.");return}
  status("","STARTING CAMERA","Please allow camera access.");
  scanner=new Html5Qrcode("reader");
  try{
    await scanner.start({facingMode:"environment"},
      {fps:10,qrbox:function(w,h){const z=Math.floor(Math.min(w,h)*.72);return{width:z,height:z}},aspectRatio:1,disableFlip:false},
      onScan,()=>{});
    running=true;start.disabled=true;stop.disabled=false;
    status("","READY TO SCAN","Point the camera at a ticket QR code.");
  }catch(e){
    scanner=null;running=false;start.disabled=false;stop.disabled=true;
    status("danger","CAMERA ERROR","Camera could not start. Allow camera permission and reload the page.");
  }
}
async function onScan(decoded){
  if(busy)return;
  const token=tokenFrom(decoded);
  if(!token){status("danger","INVALID QR","This QR is not a KYS EVENT ticket.");return}
  busy=true;await stopScanner();verifying();
  const who=volunteer.value.trim()||"Unknown Volunteer";
  callbackName="__kysCheckin_"+Date.now()+"_"+Math.random().toString(36).slice(2);
  window[callbackName]=function(r){cleanup();busy=false;result(r);start.disabled=false;stop.disabled=true};
  const p=new URLSearchParams({api:"checkin_jsonp",callback:callbackName,key:SCANNER_KEY,token:token,volunteer:who,_:String(Date.now())});
  const script=document.createElement("script");script.src=API_URL+"?"+p.toString();script.async=true;
  script.onerror=function(){
    if(!busy)return;cleanup();busy=false;
    status("danger","SERVER CONNECTION ERROR","Could not receive the ticket server response. Do not immediately rescan; wait a few seconds and try once.");
    start.disabled=false;
  };
  document.head.appendChild(script);
  timer=setTimeout(function(){
    if(!busy)return;cleanup();busy=false;
    status("warning","RESPONSE DELAYED","Server did not reply within 20 seconds. Do not repeatedly scan the same QR; check the sheet before retrying.");
    start.disabled=false;
  },TIMEOUT);
}
start.onclick=startScanner;
stop.onclick=async function(){await stopScanner();if(!busy)status("","READY TO SCAN","Point the camera at a ticket QR code.")};
window.addEventListener("beforeunload",function(){cleanup();if(scanner)scanner.stop().catch(function(){});});
})();
</script>
</body>
</html>
