<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KYS Event Check-In</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#090b0e;
  color:#fff;
  font-family:Arial,sans-serif;
}
.app{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  padding:20px 15px 30px;
}
.header{text-align:center;margin-bottom:18px}
.logo{
  width:58px;height:58px;
  margin:auto;border-radius:18px;
  background:#fff;color:#111;
  display:flex;align-items:center;justify-content:center;
  font-size:25px;font-weight:900;
}
h1{font-size:24px;margin:12px 0 4px}
.sub{color:#9299a5;font-size:13px}

.card{
  background:#15181d;
  border:1px solid #292e36;
  border-radius:22px;
  padding:16px;
  margin-bottom:14px;
}

label{
  display:block;
  color:#aab1bc;
  font-size:12px;
  margin-bottom:7px;
}

input{
  width:100%;
  padding:15px;
  border-radius:13px;
  border:1px solid #353b46;
  background:#0b0e12;
  color:#fff;
  font-size:16px;
  outline:none;
}

button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:16px;
  font-size:16px;
  font-weight:800;
}

.start{
  margin-top:12px;
  background:#fff;
  color:#111;
}

#reader{
  width:100%;
  overflow:hidden;
  border-radius:17px;
}

#reader video{
  border-radius:17px!important;
}

.camera-note{
  text-align:center;
  color:#969eaa;
  font-size:12px;
  margin-top:10px;
}

.result{
  display:none;
  border-radius:22px;
  padding:25px 18px;
  text-align:center;
  margin-top:14px;
}

.valid{background:#10291b;border:1px solid #217844}
.used{background:#351515;border:1px solid #873434}
.invalid{background:#321817;border:1px solid #79312d}
.verify{background:#322b12;border:1px solid #806d22}

.icon{
  width:70px;height:70px;
  border-radius:50%;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,.08);
  font-size:36px;
  font-weight:900;
}

.title{
  font-size:24px;
  font-weight:900;
  margin-top:12px;
}

.person{
  font-size:18px;
  font-weight:700;
  margin-top:10px;
}

.details{
  color:#b9bfc8;
  font-size:13px;
  line-height:1.7;
  margin-top:8px;
}

.next{
  margin-top:18px;
  background:#fff;
  color:#111;
}

.error{
  display:none;
  color:#ff8b8b;
  text-align:center;
  font-size:13px;
  line-height:1.5;
  margin-top:12px;
}
</style>
</head>

<body>

<div class="app">

<div class="header">
  <div class="logo">K</div>
  <h1>KYS EVENT</h1>
  <div class="sub">10 OCTOBER • 7 PM • MUMBAI</div>
</div>

<div class="card">

<label>VOLUNTEER NAME</label>

<input
  id="volunteer"
  type="text"
  placeholder="Enter volunteer name"
>

<button class="start" onclick="startScanner()">
  📷 START SCANNER
</button>

<div id="error" class="error"></div>

</div>

<div class="card" id="cameraCard" style="display:none">

<div id="reader"></div>

<div class="camera-note">
  QR code ko box ke andar rakhein
</div>

</div>

<div id="result" class="result">

<div id="icon" class="icon"></div>

<div id="title" class="title"></div>

<div id="person" class="person"></div>

<div id="details" class="details"></div>

<button class="next" onclick="nextTicket()">
SCAN NEXT TICKET
</button>

</div>

</div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbwzmhPRaHzTuSWV9ty-RY8ZAdqOyAkKeqGWvU1FiI-lNVsqRuouRhd7dUd1tTtVOlnr/exec";

let scanner=null;
let busy=false;


// ========================================
// START
// ========================================

async function startScanner(){

  const volunteer =
    document.getElementById("volunteer")
    .value.trim();

  if(!volunteer){

    alert("Please enter volunteer name first.");

    document.getElementById("volunteer").focus();

    return;
  }


  showError("");


  try{

    // THIS MUST BE CALLED FROM A USER CLICK
    const stream =
      await navigator.mediaDevices.getUserMedia({
        video:{
          facingMode:{ideal:"environment"}
        },
        audio:false
      });


    // Stop temporary permission stream.
    stream.getTracks().forEach(
      track=>track.stop()
    );


    document.getElementById(
      "cameraCard"
    ).style.display="block";


    scanner =
      new Html5Qrcode("reader");


    const cameras =
      await Html5Qrcode.getCameras();


    if(!cameras.length){

      throw new Error(
        "No camera found."
      );

    }


    let cameraId =
      cameras[0].id;


    for(const camera of cameras){

      const name =
        String(camera.label||"")
        .toLowerCase();

      if(
        name.includes("back")||
        name.includes("rear")||
        name.includes("environment")
      ){

        cameraId=camera.id;
        break;

      }

    }


    await scanner.start(

      cameraId,

      {
        fps:10,

        qrbox:function(w,h){

          const size =
            Math.floor(
              Math.min(w,h)*.72
            );

          return{
            width:size,
            height:size
          };

        }
      },

      decodedText=>{

        if(busy)return;

        busy=true;

        checkTicket(decodedText);

      },

      ()=>{}

    );

  }
  catch(err){

    console.error(err);

    showError(
      "Camera permission/access nahi mila.<br><br>"+
      "Browser ke camera permission ko Allow karo "+
      "aur START SCANNER dobara dabao."
    );

  }

}


// ========================================
// QR
// ========================================

async function checkTicket(value){

  if(scanner){

    try{
      await scanner.stop();
    }catch(e){}

  }


  const token =
    extractToken(value);


  if(!token){

    busy=false;

    showResult(
      "invalid",
      "INVALID QR",
      "",
      "Valid event ticket scan karo."
    );

    return;
  }


  const volunteer =
    document.getElementById(
      "volunteer"
    ).value.trim();


  /*
    We call Apps Script through a
    normal HTTPS GET request.
  */

  const url =
    API_URL+
    "?api=checkin"+
    "&token="+
    encodeURIComponent(token)+
    "&volunteer="+
    encodeURIComponent(volunteer);


  try{

    const response =
      await fetch(url);


    const data =
      await response.json();


    showResponse(data);

  }
  catch(err){

    console.error(err);

    showResult(
      "invalid",
      "SYSTEM ERROR",
      "",
      "Internet connection check karo."
    );

  }

}


// ========================================
// TOKEN
// ========================================

function extractToken(value){

  value=String(value||"").trim();

  if(!value)return"";


  try{

    if(
      value.startsWith("http://")||
      value.startsWith("https://")
    ){

      const url =
        new URL(value);

      return(
        url.searchParams
        .get("token")||""
      );

    }

  }catch(e){}


  return value;

}


// ========================================
// RESPONSE
// ========================================

function showResponse(data){

  if(!data){

    showResult(
      "invalid",
      "INVALID TICKET",
      "",
      "No response."
    );

    return;
  }


  if(data.status==="USED"){

    showResult(
      "used",
      "ALREADY CHECKED IN",
      data.name||"",
      "Checked in by: "+
      (data.checkedInBy||"Unknown")+
      "<br>Ticket #"+
      (data.ticketNumber||"")
    );

    return;
  }


  if(data.status==="NOT VALID"){

    showResult(
      "verify",
      "PAYMENT NOT VERIFIED",
      data.name||"",
      data.message||""
    );

    return;
  }


  if(data.status==="INVALID"){

    showResult(
      "invalid",
      "INVALID TICKET",
      "",
      data.message||""
    );

    return;
  }


  if(data.ok===true){

    showResult(
      "valid",
      "ENTRY ALLOWED",
      data.name||"",
      "Ticket #"+
      data.ticketNumber+
      " of "+
      data.quantity+
      "<br>Booking: "+
      data.bookingId+
      "<br>Checked in by: "+
      data.checkedInBy
    );

    return;
  }


  showResult(
    "invalid",
    "INVALID TICKET",
    "",
    data.message||""
  );

}


// ========================================
// RESULT
// ========================================

function showResult(
  type,
  title,
  person,
  details
){

  const box =
    document.getElementById("result");

  box.className =
    "result "+type;

  document.getElementById("icon")
    .innerHTML =
    type==="valid"
      ?"✓"
      :type==="used"
      ?"!"
      :"×";

  document.getElementById("title")
    .textContent=title;

  document.getElementById("person")
    .textContent=person||"";

  document.getElementById("details")
    .innerHTML=details||"";

  box.style.display="block";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


// ========================================
// NEXT
// ========================================

function nextTicket(){

  busy=false;

  document.getElementById(
    "result"
  ).style.display="none";

  startScanner();

}


// ========================================
// ERROR
// ========================================

function showError(message){

  const e =
    document.getElementById("error");

  e.innerHTML=message;

  e.style.display =
    message ? "block":"none";

}

</script>

</body>
</html>
